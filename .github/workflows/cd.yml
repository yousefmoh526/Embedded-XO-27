name: Game CD

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-deploy-game:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Get version from tag
      id: get_version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git describe --tags --always --dirty)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Install Qt6 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-multimedia-dev \
          libqt6multimedia6 \
          libqt6multimediawidgets6 \
          cmake \
          build-essential \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          pkg-config \
          patchelf \
          zip \
          fuse \
          file \
          desktop-file-utils
        
    - name: Set Qt6 environment variables
      run: |
        echo "CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt6:/usr/lib/x86_64-linux-gnu/cmake/Qt6Multimedia" >> $GITHUB_ENV
        echo "Qt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6" >> $GITHUB_ENV
        echo "Qt6Multimedia_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6Multimedia" >> $GITHUB_ENV
        
    - name: Fix case sensitivity issues
      run: |
        find . -name "*.cpp" -o -name "*.h" | xargs sed -i 's/#include "passwordTextEdit\.h"/#include "passwordtextedit.h"/g' || true
        
    - name: Build game
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON
        cmake --build . --config Release --parallel
        
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config Release
        
    - name: Create game assets structure
      run: |
        cd build
        mkdir -p game-package/{bin,lib,assets,docs}
        
        # Find and copy game executable
        GAME_EXECUTABLE=$(find . -type f -executable -name "*" | grep -v CMake | grep -v test | head -1)
        if [ -n "$GAME_EXECUTABLE" ]; then
          cp "$GAME_EXECUTABLE" game-package/bin/
          GAME_NAME=$(basename "$GAME_EXECUTABLE")
          echo "GAME_NAME=$GAME_NAME" >> $GITHUB_ENV
          
          # Copy Qt and other dependencies
          echo "Copying game dependencies..."
          ldd "$GAME_EXECUTABLE" | grep -E "(Qt6|libicu|libGL|libX)" | awk '{print $3}' | xargs -I {} cp {} game-package/lib/ || true
          
          # Copy game assets (adjust paths as needed for your game)
          if [ -d "../assets" ]; then
            cp -r ../assets/* game-package/assets/ || true
          fi
          if [ -d "../resources" ]; then
            cp -r ../resources/* game-package/assets/ || true
          fi
          if [ -d "../data" ]; then
            cp -r ../data/* game-package/assets/ || true
          fi
          
          # Copy documentation
          if [ -f "../README.md" ]; then
            cp ../README.md game-package/docs/
          fi
          if [ -f "../LICENSE" ]; then
            cp ../LICENSE game-package/docs/
          fi
          
          # Create launch script
          cat > game-package/launch-game.sh << EOF
        #!/bin/bash
        DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        export LD_LIBRARY_PATH="\$DIR/lib:\$LD_LIBRARY_PATH"
        cd "\$DIR"
        exec "\$DIR/bin/$GAME_NAME" "\$@"
        EOF
          chmod +x game-package/launch-game.sh
          
          # Create desktop entry for Linux
          cat > game-package/$GAME_NAME.desktop << EOF
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=$GAME_NAME
        Comment=Game built with Qt6
        Exec=./launch-game.sh
        Icon=$GAME_NAME
        Terminal=false
        Categories=Game;
        EOF
        fi
        
    - name: Create AppImage (Universal Linux Gaming Distribution)
      run: |
        cd build
        if [ -n "$GAME_NAME" ]; then
          # Download AppImage tools
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Prepare AppDir structure
          mkdir -p AppDir
          cp -r game-package/* AppDir/
          
          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
        #!/bin/bash
        HERE="$(dirname "$(readlink -f "${0}")")"
        export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
        cd "${HERE}"
        exec "${HERE}/bin/GAME_PLACEHOLDER" "$@"
        EOF
          sed -i "s/GAME_PLACEHOLDER/$GAME_NAME/g" AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Copy desktop file and make it executable
          if [ ! -f "AppDir/$GAME_NAME.desktop" ]; then
            cp AppDir/$GAME_NAME.desktop AppDir/
          fi
          
          # Create icon (placeholder - replace with your game icon)
          if [ ! -f "AppDir/$GAME_NAME.png" ]; then
            # Create a simple placeholder icon
            convert -size 256x256 xc:blue -pointsize 48 -fill white -gravity center -annotate +0+0 "GAME" AppDir/$GAME_NAME.png 2>/dev/null || touch AppDir/$GAME_NAME.png
          fi
          
          # Build AppImage
           ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir $GAME_NAME-${{ steps.get_version.outputs.version }}-x86_64.AppImage
        fi
        
    - name: Create traditional Linux distribution package
      run: |
        cd build
        if [ -n "$GAME_NAME" ]; then
          # Create tar.gz for traditional Linux distribution
          tar -czf $GAME_NAME-${{ steps.get_version.outputs.version }}-linux-x64.tar.gz -C game-package .
        fi
        
    - name: Create itch.io compatible package
      run: |
        cd build
        if [ -n "$GAME_NAME" ]; then
          # Create itch.io compatible zip
          cd game-package
          zip -r ../$GAME_NAME-${{ steps.get_version.outputs.version }}-itch.io.zip .
          cd ..
        fi
        
    - name: Prepare Steam deployment (mock)
      run: |
        cd build
        if [ -n "$GAME_NAME" ]; then
          # Create Steam-ready build structure
          mkdir -p steam-build
          cp -r game-package/* steam-build/
          
          # Create Steam depot structure (this would be used with SteamCMD in real deployment)
          echo "Steam build prepared in steam-build/ directory"
          echo "In production, this would upload to Steam using SteamCMD"
        fi
        
    - name: Upload game artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-builds-${{ steps.get_version.outputs.version }}
        path: |
          build/*.AppImage
          build/*.tar.gz
          build/*.zip
        retention-days: 30  # Artifacts for testing/development
        
    - name: Create GitHub Release for Gamers
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/*.AppImage
          build/*.tar.gz
          build/*.zip
        name: "${{ env.GAME_NAME }} ${{ steps.get_version.outputs.version }}"
        body: |
          ## 🎮 Game Release ${{ steps.get_version.outputs.version }}
          
          **Download and play instantly!** No installation required.
          
          ### 📥 Downloads:
          - **🐧 Linux AppImage** (Recommended): Universal Linux - just download and run!
          - **📦 Linux tar.gz**: Traditional package with launch script
          - **🎯 Source Package**: For developers and modders
          
          ### 🚀 Quick Start:
          **AppImage (Easiest):**
          ```bash
          # Download the .AppImage file, then:
          chmod +x ${{ env.GAME_NAME }}-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          ./${{ env.GAME_NAME }}-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          ```
          
          **Traditional Linux:**
          ```bash
          # Download and extract the .tar.gz, then:
          tar -xzf ${{ env.GAME_NAME }}-${{ steps.get_version.outputs.version }}-linux-x64.tar.gz
          cd ${{ env.GAME_NAME }}-${{ steps.get_version.outputs.version }}-linux-x64/
          ./launch-game.sh
          ```
          
          ### 💻 System Requirements:
          - **OS**: Linux x64 (Ubuntu 20.04+, Fedora 35+, or equivalent)
          - **Graphics**: OpenGL 3.3+ support
          - **Dependencies**: All Qt6 libraries included
          - **RAM**: 512MB minimum
          - **Storage**: 100MB+ free space
          
          ### 🐛 Issues?
          Report bugs in the [Issues](../../issues) section!
          
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
