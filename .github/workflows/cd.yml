name: C++ CD

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git describe --tags --always --dirty)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Install Qt6 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-multimedia-dev \
          libqt6multimedia6 \
          libqt6multimediawidgets6 \
          cmake \
          build-essential \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          pkg-config \
          patchelf
        
    - name: Set Qt6 environment variables
      run: |
        echo "CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt6:/usr/lib/x86_64-linux-gnu/cmake/Qt6Multimedia" >> $GITHUB_ENV
        echo "Qt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6" >> $GITHUB_ENV
        echo "Qt6Multimedia_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6Multimedia" >> $GITHUB_ENV
      
    - name: Fix case sensitivity issues
      run: |
        find . -name "*.cpp" -o -name "*.h" | xargs sed -i 's/#include "passwordTextEdit\.h"/#include "passwordtextedit.h"/g' || true
      
    - name: Build project
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON
        cmake --build . --config Release --parallel
        
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config Release
        
    - name: Create portable package
      run: |
        cd build
        mkdir -p package/lib
        
        # Copy executable (assuming main executable name - adjust as needed)
        EXECUTABLE=$(find . -type f -executable -name "*" | grep -v CMake | head -1)
        if [ -n "$EXECUTABLE" ]; then
          cp "$EXECUTABLE" package/
          EXEC_NAME=$(basename "$EXECUTABLE")
          
          # Copy Qt libraries
          ldd "$EXECUTABLE" | grep -E "(Qt6|libicu)" | awk '{print $3}' | xargs -I {} cp {} package/lib/ || true
          
          # Create launch script
          cat > package/run.sh << EOF
        #!/bin/bash
        DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        export LD_LIBRARY_PATH="\$DIR/lib:\$LD_LIBRARY_PATH"
        exec "\$DIR/$EXEC_NAME" "\$@"
        EOF
          chmod +x package/run.sh
          
          # Create archive
          tar -czf ../myapp-${{ steps.get_version.outputs.version }}-linux-x64.tar.gz -C package .
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: myapp-${{ steps.get_version.outputs.version }}-linux-x64
        path: "*.tar.gz"
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.tar.gz"
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
